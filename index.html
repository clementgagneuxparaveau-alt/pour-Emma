<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Emma ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- Police -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Écran mot de passe -->
    <div id="password-screen">

        <div class="password-box">

            <h1>❤️</h1>

            <h2>Un petit endroit rien que pour toi</h2>

            <p>Entre notre mot de passe...</p>

            <input
                type="password"
                id="password"
                placeholder="Mot de passe">

            <button id="unlockBtn">
                Entrer
            </button>

            <p id="error"></p>

        </div>

    </div>

    <!-- Contenu principal -->
    <main id="main-content" class="hidden">

        <!-- Fond -->
        <div class="background"></div>

        <!-- Hero -->
        <section class="hero fade">

            <h1>
                Pour Emma ❤️
            </h1>

            <p>
                Parce que chaque instant avec toi est mon préféré.
            </p>

        </section>

        <!-- Compteur -->
        <section class="counter fade">

            <h2>
                Ensemble depuis...
            </h2>

            <div id="love-counter">

                <div class="time-box">
                    <span id="days">0</span>
                    <small>Jours</small>
                </div>

                <div class="time-box">
                    <span id="hours">0</span>
                    <small>Heures</small>
                </div>

                <div class="time-box">
                    <span id="minutes">0</span>
                    <small>Minutes</small>
                </div>

                <div class="time-box">
                    <span id="seconds">0</span>
                    <small>Secondes</small>
                </div>

            </div>

        </section>

        <!-- Galerie -->
        <section class="gallery fade">

            <h2>Nos souvenirs 📸</h2>

            <div class="gallery-grid">

               <img src="photo1.jpg" alt="">
<img src="photo2.jpg" alt="">
<img src="photo3.jpg" alt="">
<img src="photo4.jpg" alt="">
<img src="photo5.jpg" alt="">

            </div>

        </section>

        <!-- Lettre -->
        <section class="letter fade">

            <h2>Une lettre pour toi 💌</h2>

            <button id="openLetter">
                Ouvrir la lettre
            </button>

        </section>

    </main>

    <!-- Popup Lettre -->
    <div id="letterModal" class="modal">

        <div class="modal-content">

            <span id="closeLetter">&times;</span>

            <h2>❤️ Ma princesse ❤️</h2>

            <div id="letterText"></div>

        </div>

    </div>

    <!-- Cœurs -->
    <div id="hearts-container"></div>

    <script src="script.js"></script>

</body>
</html>
